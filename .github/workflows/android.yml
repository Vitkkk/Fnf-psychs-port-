name: Android Mobile Creator Build

on:
  push:
    branches: [main, feat/mobile-editor-m1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout mobile overlay
        uses: actions/checkout@v4

      - name: Checkout pinned Kviks Android base
        run: |
          git clone https://github.com/kviks/Psych-Engine-Android.git engine
          cd engine
          git checkout 8d84350fa92ecdf2b359492e01524385df094851

      - name: Apply mobile editor overlay
        run: python3 tools/apply_overlay.py engine

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.3

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r15c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r15c
          add-to-path: false

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-psych042-${{ runner.os }}-v2

      - name: Install Haxe libraries
        working-directory: engine
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl --quiet
          haxelib install flixel 4.9.0 --quiet
          haxelib install hxcpp --quiet
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib git extension-webview https://github.com/HaxeExtension/extension-webview.git --quiet || true
          haxelib git extension-webm https://github.com/jigsaw-4277821/extension-webm --quiet
          haxelib git linc_luajit https://github.com/Daninnocent/linc_luajit.git --quiet
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit.git --quiet || true
          haxelib run lime setup
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          haxelib list

      - name: Build debug APK
        working-directory: engine
        shell: bash
        run: |
          set -euxo pipefail
          haxelib run lime build android -debug

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find engine/export -type f -name '*.apk' -print -exec cp '{}' artifacts/ \; || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-MobileCreator-debug
          path: artifacts/*.apk
          if-no-files-found: warn
