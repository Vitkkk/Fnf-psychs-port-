name: Android Mobile Creator Build

on:
  push:
    branches: [main, feat/mobile-editor-m1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout mobile overlay
        uses: actions/checkout@v4

      - name: Checkout pinned Kviks Android base
        run: |
          git clone https://github.com/kviks/Psych-Engine-Android.git engine
          cd engine
          git checkout 8d84350fa92ecdf2b359492e01524385df094851

      - name: Apply mobile editor overlay
        run: python3 tools/apply_overlay.py engine

      - name: Ensure legacy asset directories exist
        shell: bash
        run: |
          set -euxo pipefail
          # Lime 7.9 validates every <assets path="..."> entry in Project.xml
          # before compiling. The pinned Kviks source references assets/videos,
          # but that directory is absent from the Git checkout because Git does
          # not track empty directories. Keep it available for the legacy build.
          mkdir -p engine/assets/videos

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.3

      - name: Setup Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r15c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r15c
          add-to-path: false

      - name: Setup Java 11 for legacy Lime build
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-psych042-${{ runner.os }}-v6

      - name: Install Haxe libraries
        working-directory: engine
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl --quiet
          haxelib install flixel 4.9.0 --quiet
          haxelib install hxcpp --quiet
          haxelib install flixel-tools --quiet
          # flixel-ui 2.4.0+ targets flixel 4.10.0+, which introduced
          # flixel.util.FlxDirectionFlags. Psych Engine Android 0.4.2 is pinned
          # to flixel 4.9.0, so keep the last compatible 2.3.x release.
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib git extension-webview https://github.com/HaxeExtension/extension-webview.git --quiet

          # The old linc_luajit haxelib bootstrap asks Ubuntu for the removed
          # libreadline6-dev package. Android uses the prebuilt ndll files in the
          # repository, so register the legacy libraries directly instead.
          mkdir -p .legacy-haxelibs
          git clone --depth 1 https://github.com/Daninnocent/linc_luajit.git .legacy-haxelibs/linc_luajit
          haxelib dev linc_luajit "$PWD/.legacy-haxelibs/linc_luajit"
          git clone --depth 1 https://github.com/nebulazorua/hxvm-luajit.git .legacy-haxelibs/hxvm-luajit
          haxelib dev hxvm-luajit "$PWD/.legacy-haxelibs/hxvm-luajit"

          haxelib run lime setup
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          haxelib list

      - name: Build debug APK
        working-directory: engine
        shell: bash
        run: |
          set -euxo pipefail
          haxelib run lime build android -debug

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find engine/export -type f -name '*.apk' -print -exec cp '{}' artifacts/ \; || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-MobileCreator-debug
          path: artifacts/*.apk
          if-no-files-found: warn
