name: Android Mobile Creator Build

on:
  push:
    branches: [main, feat/mobile-editor-m1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout mobile overlay
        uses: actions/checkout@v4

      - name: Checkout pinned Kviks Android base
        run: |
          git clone https://github.com/kviks/Psych-Engine-Android.git engine
          cd engine
          git checkout 8d84350fa92ecdf2b359492e01524385df094851

      - name: Apply mobile editor overlay
        run: python3 tools/apply_overlay.py engine

      - name: Apply legacy API compatibility fixes
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/new FlxUIInputText(x, y, width, value, 21)/new FlxUIInputText(x, y, Std.int(width), value, 21)/' engine/source/editors/mobile/MobileChartBridge.hx

      - name: Ensure legacy asset directories exist
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p engine/assets/videos

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.3

      - name: Setup Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r15c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r15c
          add-to-path: false

      - name: Setup Java 11 for legacy Lime build
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-psych042-${{ runner.os }}-v6

      - name: Install Haxe libraries
        working-directory: engine
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl --quiet
          haxelib install flixel 4.9.0 --quiet
          haxelib install hxcpp --quiet
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib git extension-webview https://github.com/HaxeExtension/extension-webview.git --quiet

          mkdir -p .legacy-haxelibs
          git clone --depth 1 https://github.com/Daninnocent/linc_luajit.git .legacy-haxelibs/linc_luajit
          haxelib dev linc_luajit "$PWD/.legacy-haxelibs/linc_luajit"
          git clone --depth 1 https://github.com/nebulazorua/hxvm-luajit.git .legacy-haxelibs/hxvm-luajit
          haxelib dev hxvm-luajit "$PWD/.legacy-haxelibs/hxvm-luajit"

          haxelib run lime setup
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          haxelib list

      - name: Build debug APK
        working-directory: engine
        shell: bash
        run: |
          set +e
          set -o pipefail
          haxelib run lime build android -debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Compiler failed with exit code $status"
            echo "Last compiler lines:"
            tail -n 80 build.log || true
            tail -n 25 build.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=Lime-Haxe::$line"
            done
            exit "$status"
          fi

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find engine/export -type f -name '*.apk' -print -exec cp '{}' artifacts/ \; || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-MobileCreator-build-log
          path: engine/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-MobileCreator-debug
          path: artifacts/*.apk
          if-no-files-found: warn
